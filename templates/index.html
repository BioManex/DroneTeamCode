<!DOCTYPE html>
<html>
<head>
    <!-- This sets your page title. You can change this to whatever you want! -->
    <title>Aerospace jam control station</title>
    <!-- The below script tag is used to load socket.io from the server. -->
    <script src="{{ url_for('static', filename='js/socket.io.js') }}"></script>
    <script src="../static/js/package/dist/chart.umd.js"></script>
</head>
<style>
    table, td, th{
        border: 1px solid black;
        border-collapse: collapse;
        padding: 3px;
    }
    tr{
        height: 33px;
        border: 1px solid black;
    }
</style>
<body>
    <h1 style="text-align: center">Control Station</h1>
    <!-- Notice how the span that contains the placeholder value has an ID. We reference this ID later in the script, and it lets us pick this element in specific. -->
    <!-- <p><b>Random number chosen by the Pi: </b> <span id="randomNumber">Loading...</span></p>
    <p><b>Barometric pressure: </b> <span id="barometricPressure">Loading...</span>hPa</p>
    <p><b>Distance: </b><span id="distance"> Loading...</span>cm</p> -->
    
    <button id="takePictureButton" style="position:absolute; left: 50px; top: 620px;">Take Picture</button> 
    <div style="height: 300px; width: 300px; border: 1px solid black; position:absolute; left: 100px; top: 300px;"><canvas id="gyro"></canvas></div>
    <img id="cameraImage" src="" alt="Live from Pi!" style="width: 500px; height: 350px; border: 1px solid black; position:absolute; left: 450px; top: 200px;">
    <div style="height: 225px; width: 500px; border: 1px solid black; position:absolute; right: 50px; top: 5px;"><canvas id="elevation"></canvas></div>
    <!-- <canvas id="rawData" style="height: 400px; width: 250px; border: 1px solid black; position:absolute; right: 250px; top: 250px;" ></canvas> -->
    <table id="rawData" style="width: 32.55%;position:absolute; right: 50px; top: 250px;">
        <tr>
            <th>Raw Data</th>
            <th></th>
        </tr>
        <tr>
            <td>Barometric pressure</td>
            <td id="barometricPressure">Loading...</td>
        </tr>
        <tr>
            <td>Lidar Dist</td>
            <td id="dist">Loading...</td>
        </tr>
        <tr>
            <td>Lidar Temp</td>
            <td id="temp">Loading...</td>
        </tr>
        <tr>
            <td>Lidar Strength</td>
            <td id="strenght">Loading...</td>
        </tr>
        <tr>
            <td>Accelerometer X</td>
            <td id="aclX">Loading...</td>
        </tr>
        <tr>
            <td>Accelerometer Y</td>
            <td id="aclY">Loading...</td>
        </tr>
        <tr>
            <td>Accelerometer Z</td>
            <td id="aclZ">Loading...</td>
        </tr>
        <tr>
            <td>Gyro X</td>
            <td id="gyrX">Loading...</td>
        </tr>
        <tr>
            <td>Gyro Y</td>
            <td id="gyrY">Loading...</td>
        </tr>
        <tr>
            <td>Gyro Z</td>
            <td id="gyrZ">Loading...</td>
        </tr>
    </table>
    <div style="height: 250px; width: 250px; border: 1px solid black; position:absolute; left: 100px; top: 30px;"><canvas id="Lidar"></canvas></div>
    <p style="font-size: 50px; position:absolute; left: 400px; top: 75px;"> <span>00:00</span></p>
    <button id="MotorUp" style="width: 400px; height: 50px; position: absolute; bottom: 80px; left: 550px;">Motor Up</button>
    <button id="MotorDown" style="width: 400px; height: 50px; position: absolute; bottom: 25px; left: 550px;">Motor Down</button>
    <button id="MotorStop" style="width: 95px; height: 105px; position: absolute; bottom: 25px; left: 450px;">Motor Stop</button>
    <script>
    const elevationChart = document.getElementById("elevation");

        var data = {
                labels: [],
                datasets: [{
                    label: 'Elevation',
                    data: [],
                    tension: 0.1,
                }]
            };

        var elevation = new Chart(elevationChart, {
            type: 'line',
            data: data
        });

        document.addEventListener('DOMContentLoaded', function(){
            var socket = io.connect('http://' + document.domain + ':' + location.port);
            socket.on('update_data', function(msg){
                var randomNumberSpan = document.getElementById('randomNumber');
                randomNumberSpan.textContent = msg.randomNumber;
                var barometricPressureSpan = document.getElementById('barometricPressure');
                barometricPressureSpan.textContent = msg.barometricPressure
                var distanceSpan = document.getElementById('dist');
                distanceSpan.textContent = msg.distance

                data.labels.push(data.labels.length + 1);
                data.datasets[0].data.push(msg.height);

            });    

            var takePictureButton = document.getElementById('takePictureButton');
            var cameraImage = document.getElementById('cameraImage');
            
            doAThingButton.addEventListener('click', function() {
                socket.emit('do_a_thing', { hello: 'Hello, Aerospace Jam! This is a message being sent from the client to the server.' });
            });

            takePictureButton.addEventListener('click', function() {
                console.log('Requesting image from server...');
                socket.emit('request_image');
            });
               
            socket.on('new_image', function(msg) {
                console.log('Received new image');
                cameraImage.src = 'data:image/jpeg;base64,' + msg.image_data;
            });
        });
    </script>
    </body>
    </html>
</body>
</html>
